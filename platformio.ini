; LumaRoK C10 — PlatformIO Hardened v3.2.0

[common]
platform  = espressif32 @ 6.5.0
board     = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    knolleary/PubSubClient        @ ^2.8
    bblanchon/ArduinoJson         @ ^6.21
    adafruit/DHT sensor library   @ ^1.4
    madhephaestus/ESP32Servo      @ ^0.13
    arduino-libraries/ArduinoHttpClient

[env:production]
extends = common
build_flags =
    -D ENABLE_BLE=true
    -D ENABLE_SERIAL_PROV=false
    -D DEPLOYMENT_MODE=1
    -D USE_RGB=false
    -D USE_I2C_EXPANDER=false
    -D LUMAROK_LOG_LEVEL=1
    -D CONFIG_FREERTOS_USE_TRACE_FACILITY=1
    -D CONFIG_ESP_TASK_WDT=y
    -D CONFIG_ESP_TASK_WDT_PANIC=y
    -D CONFIG_HEAP_CORRUPTION_DETECTION=1
    -D CORE_DEBUG_LEVEL=0
    -Os -fno-exceptions -fdata-sections -ffunction-sections
    -Wl,--gc-sections -Wall -Wno-unused-variable
extra_scripts = post:scripts/size_check.py

; ESP32-WROVER-E target (8MB PSRAM). GPIO16/17 are reserved internally for
; PSRAM on this module — BOARD_HAS_PSRAM tells core/Config.h to disable US1
; (occupancy ultrasonic) rather than wire it to pins that don't exist on
; this hardware. Use this env, not [env:production], when flashing a
; WROVER-E board. Door/window sensors also require USE_I2C_EXPANDER=true on
; this board (no free GPIO) — wire a PCF8574 before enabling them.
[env:wrover_production]
extends = env:production
board = esp-wrover-kit
framework = espidf, arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env:production.build_flags}
    -D BOARD_HAS_PSRAM
    -D USE_I2C_EXPANDER=true

[env:factory]
extends = env:production
build_flags =
    ${env:production.build_flags}
    -U ENABLE_SERIAL_PROV -D ENABLE_SERIAL_PROV=true
    -U LUMAROK_LOG_LEVEL  -D LUMAROK_LOG_LEVEL=3

[env:development]
extends = common
build_flags =
    -D ENABLE_BLE=true -D ENABLE_SERIAL_PROV=true
    -D DEPLOYMENT_MODE=1 -D DEBUG_MODE=true
    -D LUMAROK_LOG_LEVEL=4
    -D CONFIG_HEAP_CORRUPTION_DETECTION=1
    -Og -g3

[env:ota_update]
extends = env:production
build_flags =
    ${env:production.build_flags}
    -U ENABLE_BLE -D ENABLE_BLE=false
